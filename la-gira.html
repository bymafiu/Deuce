<style>
/* deuce · La gira (prototipo)
   Diseño: el de deuce. Papel, tinta, los tres colores de superficie y el amarillo pelota
   para lo que suma. Una columna de 460px, como el juego en el móvil. */
:root{
  --paper:#FAF8F3; --surface:#FFFFFF; --rule:#E4DED2; --ink:#15130F; --ink-soft:#6E6860; --faint:#A39C90;
  --btn:#15130F; --btn-ink:#FAF8F3;
  --tierra:#C4653A; --dura:#4A8AC0; --hierba:#3E8A4A;
  --optic:#D6EF45; --on-optic:#15130F; --gana:#2F7A3D; --pierde:#C8384F; --gold:#B8901A;
  --night:#1E1C19; --night-2:#34312C; --night-ink:#FAF8F3;
  --shadow:0 1px 2px rgba(30,20,10,.06);
  --linea:rgba(255,255,255,.85); --jug-yo:#15130F; --jug-el:#FFFFFF; --piel:#E2AE86; --raqueta:#26231F;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121314; --surface:#1C1E20; --rule:#2B2E31; --ink:#EDEEEF; --ink-soft:#8A8F94; --faint:#5E6368;
  --btn:#EDEEEF; --btn-ink:#121314; --tierra:#E0774A; --dura:#5C9FE0; --hierba:#52AF63;
  --gana:#6CC67C; --pierde:#F4707F; --gold:#E9C46A; --night:#0B0C0D; --night-2:#26292C; --night-ink:#FAF8F3;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#121314; --surface:#1C1E20; --rule:#2B2E31; --ink:#EDEEEF; --ink-soft:#8A8F94; --faint:#5E6368;
  --btn:#EDEEEF; --btn-ink:#121314; --tierra:#E0774A; --dura:#5C9FE0; --hierba:#52AF63;
  --gana:#6CC67C; --pierde:#F4707F; --gold:#E9C46A; --night:#0B0C0D; --night-2:#26292C; --night-ink:#FAF8F3;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--dura);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}

/* barra de arriba y la escalera de torneos */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:9px}
.top-fila{display:flex;align-items:center;gap:10px}
.marca{display:flex;flex-direction:column;line-height:1}
.marca b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.marca span{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.chips{margin-left:auto;display:flex;gap:6px}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.sube{animation:sube 1.5s ease both}
@keyframes sube{0%{transform:scale(.6);background:var(--optic);color:var(--on-optic)}25%{transform:scale(1.15);background:var(--optic);color:var(--on-optic)}45%{transform:none;background:var(--optic);color:var(--on-optic)}100%{transform:none}}
.escalera{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.escalera i{height:8px;border-radius:2px;background:var(--sup);opacity:.22}
.escalera i.hecho{opacity:1}
.escalera i.ahora{opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.escalera i.grande{height:12px;margin-top:-2px}

.pant{display:flex;flex-direction:column;gap:14px;padding-top:16px;animation:entra .3s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
h1{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.lead{font-size:16px;line-height:1.55;color:var(--ink-soft);text-wrap:pretty}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow)}
.btn{width:100%;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);padding:15px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn[disabled]{background:var(--rule);color:var(--ink-soft);cursor:default;transform:none}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.reglas{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.reglas li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.reglas b{color:var(--ink)}
.reglas .n{width:8px;height:8px;border-radius:50%;background:var(--ink);justify-self:center;margin-top:7px}

/* atributos */
.attrs{display:grid;gap:8px}
.attr{display:grid;grid-template-columns:118px minmax(0,1fr) 34px;align-items:center;gap:8px;font-size:13px}
.attr .nom{font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.attr .x2,.a2 .x2{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:4px;background:var(--sup);color:#fff;letter-spacing:.04em}
.attr .x2.cab{background:var(--ink);color:var(--paper)}
.barra{height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.barra i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ink)}
.barra i.clave{background:var(--sup)}
.barra i.fant{background:var(--optic);z-index:0}
.barra i.real{z-index:1}
.attr .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.attr .v small{display:block;font-size:10px;font-weight:700;color:var(--gana)}
.nota-cab{font-size:11.5px;color:var(--ink-soft)}

/* estilos de salida */
.estilos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.estilo{display:flex;flex-direction:column;gap:5px;text-align:left;border:1.5px solid var(--rule);border-radius:14px;background:var(--surface);padding:13px 12px 11px;cursor:pointer;box-shadow:inset 0 4px 0 var(--sup);transition:transform .08s}
.estilo:active{transform:scale(.97)}
.estilo.on{border-color:var(--ink);box-shadow:inset 0 4px 0 var(--sup),0 0 0 1.5px var(--ink) inset}
.estilo b{font-size:14.5px}
.estilo .st{font-style:normal;align-self:flex-start;margin-top:3px;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--sup);color:#fff;font-variant-numeric:tabular-nums}
.estilo[data-id=cerebral] .st{color:#15130F}

/* portada: como la de deuce, centrada y con la marca arriba */
.portada{padding-top:0;text-align:center}
.portada-cab{display:flex;flex-direction:column;align-items:center;line-height:1;margin:0 -16px;padding:11px 16px;border-bottom:1px solid var(--rule)}
.portada-cab b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.portada-cab span{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.modo{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:24px;padding:26px 18px 28px;box-shadow:var(--shadow)}
.modo h1{font-size:46px}
.portada .k{text-align:center}
.pant.quieta{animation:none}

/* lo que tienes, encima de la tienda */
.tienda-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.caja{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.caja .mon{font-size:17px;font-weight:800;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;box-shadow:var(--shadow)}
.caja.sube .mon{animation:sube 1.5s ease both}
.caja.baja .mon{animation:gasta .6s ease both}
@keyframes gasta{0%{transform:scale(.88);color:var(--pierde)}40%{transform:scale(1.06);color:var(--pierde)}100%{transform:none}}
.estilo span{font-size:12px;color:var(--ink-soft);line-height:1.35}

/* torneo */
.torneo{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:15px 16px;box-shadow:inset 0 4px 0 var(--sup),var(--shadow)}
.torneo .fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sup{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--sup);padding:3px 8px;border-radius:999px}
.tier{font-size:11px;font-weight:700;color:var(--ink-soft)}
.torneo .fila h2{flex:1 1 9ch;min-width:0;text-wrap:balance}
.prob{flex:none;margin-left:auto;text-align:right;line-height:1.1}
.prob b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.prob span{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.cuenta{font-size:13px;color:var(--ink-soft)}
.torneo.compacto{gap:5px;padding:12px 14px 12px}
.torneo.compacto h2{font-size:20px}
.torneo.compacto .prob b{font-size:22px}
.torneo.compacto .tier{font-variant-numeric:tabular-nums}
.yo{display:grid;gap:10px;padding:12px 14px}
.attrs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.a2{display:grid;gap:5px;min-width:0}
.a2-t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.a2-t b{margin-left:auto;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.a2 .barra{height:7px}
.cuenta b{color:var(--ink)}

/* cartas */
.ico{width:32px;height:32px;image-rendering:pixelated;display:block;flex:none}
.tienda{display:grid;gap:8px}
.oferta{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 11px;box-shadow:inset 3px 0 0 var(--fam)}
.oferta.r-rara,.oferta.r-mítica{border-color:var(--ink)}
.oferta.r-mítica{box-shadow:inset 3px 0 0 var(--fam),0 0 0 2px var(--optic)}
.oferta.maldita{background:var(--night);color:var(--night-ink);border-color:var(--night-2)}
.oferta .arte{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center}
/* botón y % flotan a la derecha; el texto los rodea y, al acabarse, usa todo el ancho */
.oferta .o-cuerpo{min-width:0;display:flow-root}
.oferta.maldita .arte{background:var(--night-2)}
.oferta .arte .ico{width:28px;height:28px}
.oferta .cab{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.2}
.oferta .nombre{font-weight:800;font-size:14.5px;letter-spacing:-.015em}
.oferta .rar{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.oferta .fx{font-size:13.5px;line-height:1.4;margin-top:3px}
.oferta .pie{float:right;margin:0 0 4px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.oferta .pie .comprar{margin-left:0;padding:7px 12px;font-size:13px}
.oferta .pie .delta{font-size:11.5px;padding:2px 8px}
.delta{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--paper);font-variant-numeric:tabular-nums}
.delta.sube{background:var(--optic);color:var(--on-optic)}
.delta.baja{color:var(--pierde)}
.oferta.maldita .delta{background:var(--night-2);color:var(--night-ink)}
.oferta.maldita .delta.sube{background:var(--optic);color:var(--on-optic)}
.comprar{margin-left:auto;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.oferta.maldita .comprar{background:var(--night-ink);color:var(--night)}
.comprar[disabled]{background:var(--rule);color:var(--ink-soft);cursor:default}
.oferta.comprada{opacity:.5}
.bolsa{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.hueco{aspect-ratio:1;border-radius:10px;border:1px solid var(--rule);background:var(--surface);display:grid;place-items:center;position:relative;cursor:pointer;padding:0;box-shadow:inset 0 3px 0 var(--fam)}
.hueco.vacio{border-style:dashed;background:transparent;cursor:default;box-shadow:none}
.hueco.sel{box-shadow:inset 0 3px 0 var(--fam),0 0 0 2.5px var(--pierde)}
.hueco.r-maldita{background:var(--night)}
.bolsa-cab{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bolsa-cab b{font-size:14px}
.bolsa-cab span{font-size:12px;color:var(--ink-soft)}
.venta{display:flex;align-items:center;gap:10px;font-size:13px}
.venta .comprar{background:var(--pierde);color:#fff}

/* cuadro y partidos */
.cuadro{display:grid;gap:0}
.ronda{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--rule)}
.ronda:first-child{border-top:0;padding-top:2px}
.ronda .rk{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.ronda .rn{font-weight:700;font-size:14.5px}
.ronda .re{font-size:11.5px;color:var(--ink-soft)}
.ronda .rp{text-align:right;font-variant-numeric:tabular-nums}
.ronda .rp b{font-size:15px}
.ronda .rp span{display:block;font-size:11px;color:var(--ink-soft)}
.marc{display:flex;gap:4px}
.sc{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:8px;background:var(--paper);animation:entra .2s ease both}
.sc.l{color:var(--pierde)}
.dif{align-self:center;justify-self:end;line-height:1.2;font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--paper);white-space:nowrap}
.dif.facil{background:var(--optic);color:var(--on-optic)}
.dif.dificil{color:var(--pierde);box-shadow:inset 0 0 0 1.5px var(--pierde);background:transparent}
.mon{white-space:nowrap;font-variant-numeric:tabular-nums}
.mon::after{content:"";display:inline-block;width:.72em;height:.72em;margin-left:.25em;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 .12em rgba(255,255,255,.35);vertical-align:-.05em}
.porque{font-size:14px;line-height:1.5;text-wrap:pretty}
/* el partido en directo, en píxel: pista con cámara de tele + marcador */
.vivo{display:grid;gap:10px}
.pista-wrap{position:relative;border-radius:16px;overflow:hidden;background:var(--sup)}
.pista-wrap canvas{display:block;width:100%;aspect-ratio:100 / 110}
.aviso-pos{position:absolute;left:0;right:0;top:calc(37% - 15px);display:flex;justify-content:center;pointer-events:none}
.aviso{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:999px;background:var(--ink);color:var(--paper);white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,.9,.3,1.3) both}
.aviso.ok{background:var(--optic);color:var(--on-optic)}
.aviso.ko{background:var(--pierde);color:#fff}
.marcador{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.mf{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;transition:background .4s,color .4s}
.mf + .mf{border-top:1px solid var(--rule)}
.mf .saque{width:8px;height:8px;border-radius:50%}
.mf.saca .saque{background:var(--optic);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.mf .mn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf .ms{display:flex;gap:3px}
.mf .ms b{width:26px;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;border-radius:6px;padding:1px 0}
.mf .ms b.ahora{background:var(--paper)}
.mf .ms b.flojo{color:var(--faint)}
.mf .ms b.pop{animation:salta .35s cubic-bezier(.3,1.6,.5,1)}
.mf.gano{background:var(--optic);color:var(--on-optic)}
.mf.gano .ms b.ahora{background:transparent}
.mf.gano .ms b.flojo{color:inherit;opacity:.45}
@keyframes salta{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:none}}
.vivo > .rapido{justify-self:center}

/* el cuadro mientras se juega */
.ronda{align-items:center}
.ronda.pend{opacity:.4}
.ronda.ahora .rn::after{content:"";display:inline-block;width:7px;height:7px;margin-left:7px;border-radius:50%;background:var(--gana);vertical-align:middle;animation:late 1s ease-in-out infinite}
@keyframes late{50%{opacity:.25}}

/* la tarjeta del final del torneo */
.titulo{position:relative;overflow:hidden;display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:2px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:20px 16px 18px;box-shadow:inset 0 4px 0 var(--sup),var(--shadow);animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}

// ── el torneo en directo ──
// Los resultados ya están decididos (S.resultado); aquí solo se cuentan, en píxel.
// De cada partido se juegan en la pista, a velocidad normal, hasta cuatro puntos: el de partido,
// los de set y la primera rotura de cada set. Los demás juegos pasan en un corte de tele: la pista

let animId = 0;

// la pista, en metros
const CT = { L: 23.77, NET: 11.885, SI: 4.115, DO: 5.485, SERV: 6.40 };

// el orden de los juegos de un set que acabó a-b (a son los tuyos)

    else if (ult) P = { x: (rnd() < .5 ? -1 : 1) * (2.9 + rnd() * 1.0), z: rc === 'r' ? CT.L - 1 - rnd() * 7 : 1 + rnd() * 7 };
    else P = { x: (rnd() * 2 - 1) * 3.2, z: rc === 'r' ? CT.L - 1.2 - rnd() * 4.5 : 1.2 + rnd() * 4.5 };
    P.x = clamp(P.x, -CT.SI + .15, CT.SI - .15);

// el plan de un partido entero: qué se ve en cada momento

  const pos = {};

  if (a === 'cerrar-col') { S = S && S.volver ? S.volver : null; return pintar(); }
  if (a === 'filtro-col') { filtroCol = b.dataset.id; return pintar(); }
  if (a === 'empezar') return empezarGira(estiloSel, (Date.now() % 1e9) | 0, nivelSel);
  if (a === 'codigo') { codigoAbierto = true; pintar(); const i = $('#in-cod'); if (i) i.focus(); return; }
  if (a === 'jugar-cod') {
    const c = leerCodigo(($('#in-cod') || {}).value);
    if (!c) { const m = $('#cod-msg'); if (m) m.textContent = 'Ese código no es de una gira. Son una G y unas letras, como G-1A2B3C.'; return; }
    codigoAbierto = false; return empezarGira(c.estilo, c.semilla, c.nivel);
  }
  if (a === 'compartir') { compartirGira(); return; }
  if (a === 'comprar') {
    const id = b.dataset.id, premio = !!b.dataset.premio, C = G.CARTA[id];
    const llena = S.e.bolsa.length >= G.huecosDe(S.e);
    if (G.comprar(S.e, id, llena ? S.sel : null, premio ? 0 : null)) {
      S.compradas.push(id); S.sel = null;
      if (C.rar === 'mítica') { sonar('mitica'); const nv = apuntar(st => { st.miticas = (st.miticas || 0) + 1; }); S.nuevasGira = (S.nuevasGira || []).concat(nv); }
      else sonar('compra');
      salvar();
    }
    return pintar();
  }
  if (a === 'vale') { if (G.comprarVale(S.e, S.vale)) { S.vale = null; sonar('compra'); salvar(); } return pintar(); }
  if (a === 'hueco') { const i = +b.dataset.i; if (i < 0) return; S.sel = S.sel === i ? null : i; return pintar(); }
  if (a === 'vender') { if (G.vender(S.e, S.sel)) { S.sel = null; sonar('compra'); salvar(); } return pintar(); }
  if (a === 'otras') { const c = costeOtras(); if (S.e.dinero < c) return; if (c === 0) S.mapaUsado = true; S.e.dinero -= c; S.ofertas = G.ofertas(S.e, rng); S.compradas = []; S.vistaMitica = false; salvar(); return pintar(); }
  if (a === 'aprevia') { S.fase = 'previa'; S.sel = null; salvar(); return pintar(); }
  if (a === 'atienda') { S.fase = 'tienda'; salvar(); return pintar(); }
  if (a === 'presion') { S.presion = !S.presion; salvar(); return pintar(); }
  if (a === 'jugar') {
    const t = S.e.torneo, riv = S.presion ? G.apretar(S.rivales) : S.rivales;
    S.antes = { dinero: S.e.dinero, seguidos: S.e.seguidos };
    S.rivalesJugados = riv; S.presionJugada = !!S.presion;
    const R = G.jugarTorneo(S.e, t, riv, rng);
    S.resultado = R; S.torneoJugado = t; S.visto = false; S.cobrado = 0;
    const final = R.partidos.filter(m => m.ronda === G.CALENDARIO[t].rondas - 1 && !m.gana).length;
    if (R.campeon) { S.cobrado = G.cerrarTorneo(S.e, R); if (S.presion) S.e._premio = true; }
    S.nuevas = apuntar(st => {
      st.maxTorneo = Math.max(st.maxTorneo || 0, t);
      if (final) st.finalesPerdidas = (st.finalesPerdidas || 0) + final;
      if (R.campeon) { st.titulos++; st.gana[t] = (st.gana[t] || 0) + 1; if (!R.setsPerdidos) st.limpio = (st.limpio || 0) + 1; st.maxDinero = Math.max(st.maxDinero || 0, S.e.dinero); }
    });
    S.nuevasGira = (S.nuevasGira || []).concat(S.nuevas);
    S.fase = 'partidos'; salvar(); return pintar();
  }
  if (a === 'todo') { terminar(true); return; }
  if (a === 'atienda2') { S.fase = 'tienda'; prepararTorneo(); salvar(); return pintar(); }
  if (a === 'afin') { S.fase = 'fin'; salvar(); return pintar(); }
  if (a === 'otra') { S = null; try { localStorage.removeItem(CLAVE_S); } catch (e) {} return pintar(); }
});
// un enlace con ?codigo= abre la portada con ese código ya puesto (si no hay una gira a medias)
try { const q = new URLSearchParams(location.search).get('codigo'); if (q && !S && leerCodigo(q)) { codigoAbierto = true; codigoInicial = q.trim().toUpperCase(); } } catch (e) {}
pintar();

</script>
