          <h2 style=\"font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em\">{{ tituloTemporada }}<\u002Fh2>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 1.1fr;gap:6px;margin-bottom:10px;flex:none\">\n          <div style=\"background:#f2f0ea;border-radius:12px;padding:8px 6px;text-align:center\">\n            <div style=\"font-size:10px;color:#6d7278;margin-bottom:2px\">{{ lEdad }}<\u002Fdiv>\n            <div style=\"{{ estiloEdad }}\">{{ edad }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f2f0ea;border-radius:12px;padding:8px 6px;text-align:center\">\n            <div style=\"font-size:10px;color:#6d7278;margin-bottom:2px\">{{ lCaja }}<\u002Fdiv>\n            <div style=\"{{ estiloCaja }}\">{{ cajaCorta }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f2f0ea;border-radius:12px;padding:8px 6px;text-align:center\">\n            <div style=\"font-size:10px;color:#6d7278;margin-bottom:2px\">{{ lPuntos }}<\u002Fdiv>\n            <div style=\"{{ estiloPuntos }}\">{{ puntos }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f2f0ea;border-radius:12px;padding:8px 6px;text-align:center\">\n            <div style=\"font-size:10px;color:#6d7278;margin-bottom:2px\">{{ lRanking }}<\u002Fdiv>\n            <div style=\"{{ estiloRank }}\">{{ rankEtiqueta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hayLogrosNuevos }}\">\n          <div style=\"border:1px solid #a3319a;border-radius:12px;padding:9px 11px;margin-bottom:10px;flex:none;animation:copaPop .4s ease both\">\n            <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#a3319a;font-weight:700;margin-bottom:3px\">{{ lDesbloqueado }}<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:700;line-height:1.3\">{{ logrosNuevosTexto }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div ref=\"{{ setR
