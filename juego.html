    console.error('Bundle unpack error:', err);

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>/* ============================================================\n   deuce · temas\n   ------------------------------------------------------------\n   Un tema por defecto y cuatro desbloqueables.\n   Se aplican poniendo data-tema en <html>:\n\n       document.documentElement.dataset.tema = 'tierra';\n\n   REGLA QUE NO SE ROMPE NUNCA:\n   --sup-* son los colores de superficie y son idénticos en los\n   cinco temas (solo se aclaran en los oscuros para mantener el\n   contraste). Llevan información, así que no pueden cambiar con\n   la decoración ni coincidir con el acento.\n   ============================================================ */\n\n:root,\n:root[data-tema=\"base\"]{\n  /* ---- por defecto · sin acento ----\n     Lo único con color en pantalla son las superficies.       */\n  --paper:      #FAF8F3;   /* fondo de la pantalla            */\n  --surface:    #FFFFFF;   /* tarjetas, campos, pastillas     */\n  --rule:       #E4DED2;   /* líneas y bordes                 */\n  --ink:        #15130F;   /* texto principal                 */\n  --ink-soft:   #6E6860;   /* texto secundario                */\n\n  --accent:     #15130F;   /* acento: aquí es la propia tinta */\n  --accent-bg:  #E8E4D9;   /* fondo de elemento seleccionado  */\n  --accent-ink: #15130F;   /* texto sobre accent-bg           */\n\n  --btn:        #15130F;\n  --btn-ink:    #FAF8F3;\n\n  --shadow:     0 1px 2px rgba(30,20,10,.06);\n\n  /* superficies · fijas */\n  --sup-tierra: #C4653A;\n  --sup-dura:   #4A8AC0;\n  --sup-duraus: #268D96;\n  --sup-hierba: #3E8A4A;\n\n  --alerta:       #C8384F;   /* aviso: sanción, solicitud denegada */\n  --alerta-borde: #C8384F;\n\n  color-scheme: light;\n}\n\n/* ------------------------------------------------------------\n   TIERRA · se desbloquea al ganar un Grand Slam en tierra\n   ------------------------------------------------------------ */\n:root[data-tema=\"tierra\"]{\n  --paper:      #FAF5EE;\n  --surface:    #FFFDFA;\n  --rule:       #E8DACA;\n  --ink:        #2A1B12;\n  --ink-soft:   #756251;\n\n  --accent:     #B4562C;\n  --accent-bg:  #F7E6D9;\n  --accent-ink: #A04A22;\n\n  --btn:        #2A1B12;\n  --btn-ink:    #FAF5EE;\n\n  --shadow:     0 1px 2px rgba(60,35,15,.07);\n\n  --sup-tierra: #C4653A;\n  --sup-dura:   #4A8AC0;\n  --sup-duraus: #268D96;\n  --sup-hierba: #3E8A4A;\n\n  --alerta:       #C8384F;   /* aviso: sanción, solicitud denegada */\n  --alerta-borde: #C8384F;\n\n  color-scheme: light;\n}\n\n/* ------------------------------------------------------------\n   DURA · se desbloquea al llegar al número uno\n   ------------------------------------------------------------ */\n:root[data-tema=\"dura\"]{\n  --paper:      #F7F6F2;\n  --surface:    #FFFFFF;\n  --rule:       #DEDCD3;\n  --ink:        #101820;\n  --ink-soft:   #616B75;\n\n  --accent:     #1F5C8C;\n  --accent-bg:  #E2EDF5;\n  --accent-ink: #1F5C8C;\n\n  --btn:        #101820;\n  --btn-ink:    #F7F6F2;\n\n  --shadow:     0 1px 2px rgba(16,24,32,.07);\n\n  --sup-tierra: #C4653A;\n  --sup-dura:   #4A8AC0;\n  --sup-duraus: #268D96;\n  --sup-hierba: #3E8A4A;\n\n  --alerta:       #C8384F;   /* aviso: sanción, solicitud denegada */\n  --alerta-borde: #C8384F;\n\n  color-scheme: light;\n}\n\n/* ------------------------------------------------------------\n   HIERBA · se desbloquea al ganar un título en hierba\n   ------------------------------------------------------------ */\n:root[data-tema=\"hierba\"]{\n  --paper:      #F8F7F0;\n  --surface:    #FFFFFE;\n  --rule:       #E0E0D2;\n  --ink:        #16281B;\n  --ink-soft:   #5E6B5C;\n\n  --accent:     #2F6B3C;\n  --accent-bg:  #E4EEE3;\n  --accent-ink: #2F6B3C;\n\n  --btn:        #16281B;\n  --btn-ink:    #F8F7F0;\n\n  --shadow:     0 1px 2px rgba(22,40,27,.07);\n\n  --sup-tierra: #C4653A;\n  --sup-dura:   #4A8AC0;\n  --sup-duraus: #268D96;\n  --sup-hierba: #3E8A4A;\n\n  --alerta:       #C8384F;   /* aviso: sanción, solicitud denegada */\n  --alerta-borde: #C8384F;\n\n  color-scheme: light;\n}\n\n/* ------------------------------------------------------------\n   GRAFITO · se desbloquea al llegar hasta la retirada. El nocturno. Sin acento de color, igual que el tema\n   por defecto: el premio es la noche, no otro color.\n   Las superficies van aclaradas para mantener contraste sobre\n   fondo oscuro.\n   ------------------------------------------------------------ */\n:root[data-tema=\"grafito\"]{\n  --paper:      #121314;\n  --surface:    #1C1E20;\n  --rule:       #2B2E31;\n  --ink:        #EDEEEF;\n  --ink-soft:   #8A8F94;\n\n  --accent:     #EDEEEF;\n  --accent-bg:  #26292C;\n  --accent-ink: #EDEEEF;\n\n  --btn:        #EDEEEF;\n  --btn-ink:    #121314;\n\n  --shadow:     0 1px 3px rgba(0,0,0,.4);\n\n  --sup-tierra: #E0774A;\n  --sup-dura:   #5C9FE0;\n  --sup-duraus: #3AB2BD;\n  --sup-hierba: #52AF63;\n\n  --alerta:       #F4707F;   /* aclarado: 11px en mayúsculas sobre fondo oscuro */\n  --alerta-borde: #8A3B46;\n\n  color-scheme: dark;\n}\n\n/* ------------------------------------------------------------\n   Transición al cambiar de tema. Se desactiva para quien\n   prefiera menos movimiento.\n   ------------------------------------------------------------ */\n@media (prefers-reduced-motion: no-preference){\n  body, .card, .stat, .btn, .seg, .inp{\n    transition: background-color .28s ease, color .28s ease,\n                border-color .28s ease;\n  }\n}\n<\u002Fstyle>\n<script src=\"466e0b41-ea78-414e-bc3f-fcb0362e1947\"><\u002Fscript>\n<script src=\"9d2e85c7-f902-4dfd-8710-83ff18facbe0\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>deuce — simulador de carrera de tenis<\u002Ftitle>\n<meta name=\"description\" content=\"Una carrera de tenis entera en una tarjeta: elige, juega la temporada y descubre hasta dónde llega tu talento.\">\n<meta name=\"theme-color\" content=\"#FAF8F3\">\n<meta property=\" dds points; building improves the months ahead.' },\n        { e: 'gira', kicker: 'Your rival', q: 'With {r} out, the Asian swing draws have opened up. It is four weeks of flights and points cheaper than usual.',\n          a: 'Play the whole swing', b: 'Stay home',\n          nota: 'More points away, more money spent.' },\n        { e: 'spon', kicker: 'Your rival', q: 'The brands that were chasing {r} are now calling you. The contract is good and the list of appearances is long.',\n          a: 'Sign now', b: 'Leave it until winter',\n          nota: 'Money comes in and court hours go out.' },\n      ],\n      delante: [\n        { e: 'plan', kicker: 'Your rival', q: 'You are number 1 and {r} comes after you every week of the year. You can defend every point or choose where to stand your ground.',\n          a: 'Defend everything', b: 'Pick my battles',\n          nota: 'Defending holds the place; choosing lets you arrive fresh at the majors.' },\n        { e: 'esp', sup: 'Dura', kicker: 'Your rival', q: 'The press already keeps score of your meetings by surface, and {r} owns the clay. Your team believes hard court is where you can take a whole year out of him.',\n          a: 'Bet on hard', b: 'Play them all the same',\n          nota: 'Specialising makes you better on hard and slightly worse elsewhere.' },\n        { e: 'gira', kicker: 'Your rival', q: '{R} has announced he is skipping the winter to prepare the season. Playing those weeks takes points off him, but you reach January on empty legs.',\n          a: 'Play the winter', b: 'Copy him and rest',\n          nota: 'More events, more points; resting improves the start of the year.' },\n      ],\n      detras: [\n        { e: 'plan', kicker: 'Your rival', q: '{R} is far enough ahead that small events will never close the gap. The only sum that works is meeting him in the last rounds of the majors.',\n          a: 'Everything for the majors', b: 'Take points where I can',\n          nota: 'Going for the major oNuevo = d.atado;\n    if (d.e === 'maestro') {\n      patch.maestroVisto = true;\n      patch.coach = si; patch.maestro = si;\n      if (si) { patch.especialista = true; patch.supEsp = d.sup || 'Tierra'; }\n    }\n    if (d.e === 'plan') patch.agresivo = si;\n    if (d.e === 'coach') patch.coach = si;\n    if (d.e === 'gira') patch.gira = si;\n    if (d.e === 'esp') { patch.especialista = si; if (si) patch.supEsp = d.sup || 'Tierra'; }\n    if (d.e === 'spon') patch.patrocinio = si;\n    if (d.e === 'cambio') patch.cambio = si;\n    if (d.e === 'tecnico2') { patch.tecnicoOfrecido = true; if (si) patch.cambio = true; }\n    if (d.e === 'rodilla1') { patch.rodillaFase = 1; patch.rodillaTemporada = s.temporada; patch.rodillaInfiltrado = si; }\n    // la temporada corta deja el equipo en tierra; seguir a calendario completo lo mantiene todo, y el riesgo.\n    // el préstamo entra AQUÍ, al aceptarlo: la temporada anterior cerró en rojo y el rojo se ve en la caja\n    if (d.e === 'apuro') {\n      patch.apuro = null;\n      // adelantan el dinero de UNA TEMPORADA, que es lo que dice el texto: el calendario de tu\n      // categoría más un margen. Con una cifra simbólica volvías a caer en rojo el año siguiente\n      // y el préstamo, que solo se da una vez, no te reenganchaba a nada\n      const temporada = this.COSTE[this.tierDe(this.rankDe(s.puntos))] * 12;\n      patch.efEuros = (patch.efEuros || 0) + Math.max(0, temporada - s.euros);\n    }\n    if (d.e === 'mecenas') { patch.mecenasFase = 2; patch.mecenasSi = si; }\n    if (d.e === 'rodilla2') { patch.rodillaFase = si ? 3 : 2; patch.rodillaOperada = si; if (si) { patch.rodillaCierre = 'operado'; patch.fuera = 0.5; } }\n    if (d.e === 'rodilla3') { patch.rodillaFase = 4; patch.rodillaCierre = si ? 'operado' : 'retiro'; }\n    if (d.e === 'familia1') { patch.familiaFase = 1; patch.familiaTemporada = s.temporada; patch.familiaPerdioBoda = si; }\n    if (d.e === 'familia2') { patch.familiaFase = 2; patch.familiaPerdioNacimiento = si; }\n    if (d.e === 'maestro' && si) patch.maestroTemporada = s.temporada;\n    if (d.e === 'retiroFinal') {\n      patch.despedida = si; patch.gira = si;\n      // dejarlo hoy es dejarlo hoy: la carrera cierra aquí, sin una temporada más.\n      // la despedida sí se juega, a calendario completo, y se cierra a mano al ver los resultados\n      if (!si) {\n        clearTimeout(this.fxProgramado);\n        this.setState({\n          despedida: false, fin: true, finPendiente: false, fx: null, fxPendiente: null,\n          temasNuevos: this.revisarTemas(s.palmares || [], s.mejorRank, s.edad),\n        });\n        return;\n      }\n    }\n    // efecto mecánico de la decisión: nivel de esta temporada, techo permanente o caja.\n    // vale para las decisiones de gira y equipo, y para los arcos del fondo (ef / ef2 por fase)\n    const arcoEf = d.e === 'arcopool' ? (() => {\n      const a = this.ARCOS_POOL.find(x => x.id === d.poolId);\n      return a ? (d.poolFase === 1 ? a.ef : a.ef2) : null;\n    })() : null;\n    const fuenteEf = d.ef || arcoEf;\n    if (fuenteEf) {\n      const ef = (si ? fuenteEf.si : fuenteEf.no) || {};\n      if (ef.nivel) patch.efNivel = ef.nivel;\n      if (ef.techo) patch.efTecho = ef.techo;\n      if (ef.euros) patch.efEuros = ef.euros;\n      if (ef.fuera) patch.fuera = ef.fuera;\n      if (ef.carga) patch.efCarga = ef.carga;\n    }\n    if (d.e === 'arcopool') {\n      const estado = Object.assign({}, s.arcosPool || {});\n      const t = Object.assign({}, s.arcosPoolT || {});\n      const elecciones = Object.assign({}, s.arcosPoolSi || {});\n      // un arco queda abierto solo si su segunda parte encaja con lo que acabas de elegir\n      const arc = this.ARCOS_POOL.find(a => a.id === d.poolId);\n      const tieneSegunda = !!(arc && (s.idioma === 'en' ? arc.en : arc.es).resuelve);\n      const sigue = tieneSegunda && (!arc.sigueSi || si);\n      estado[d.poolId] = (d.poolFase === 1 && sigue) ? 1 : 2;\n      if (d.poolFase === 1 cenasSi ? t.final : t.finalNo) : t.rescate);\n    }\n    Object.keys(s.arcosPool || {}).forEach(id => {\n      const arc = this.ARCOS_POOL.find(a => a.id === id);\n      if (!arc) return;\n      const D = en ? arc.en : arc.es;\n      const si = !!(s.arcosPoolSi || {})[id];\n      const nodo = s.arcosPool[id] === 2 && D.resuelve ? D.resuelve : D.plantea;\n      const elegido = si ? nodo.a : nodo.b;\n      out.push((en ? 'You chose: ' : 'Elegiste: ') + elegido.charAt(0).toLowerCase() + elegido.slice(1) + '.');\n    });\n    return out;\n  }\n\n  SUP_EN = { Tierra: 'Clay', Hierba: 'Grass', Dura: 'Hard' };\n  tierDeSede(nombre) {\n    if (this.GS.indexOf(nombre) >= 0) return 'gs';\n    if (this.M1000.indexOf(nombre) >= 0) return 'm1000';\n    const regiones = ['SAM', 'EUR', 'NAM', 'ASI'];\n    for (const tier of ['atp', 'ch', 'itf']) {\n      for (const r of regiones) if ((this.CAL[r][tier] || []).indexOf(nombre) >= 0) return tier;\n    }\n    return 'atp';\n  }\n  TROFEO_GS = {\n    'Open de Australia': '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\"><path d=\"M7 3h10v4a5 5 0 0 1-10 0V3z\" fill=\"#4a7fc1\"/><path d=\"M5 4H3v2a4 4 0 0 0 4 4V8a2 2 0 0 1-2-2V4zM19 4h2v2a4 4 0 0 1-4 4V8a2 2 0 0 0 2-2V4z\" fill=\"#4a7fc1\"/><rect x=\"10.5\" y=\"12\" width=\"3\" height=\"5\" fill=\"#4a7fc1\"/><path d=\"M8 20h8l-1-3H9z\" fill=\"#4a7fc1\"/><\u002Fsvg>',\n    'Open de Francia': '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\"><path d=\"M6 3h12v6a6 6 0 0 1-12 0V3z\" fill=\"#c2673f\"/><rect x=\"10.5\" y=\"15\" width=\"3\" height=\"4\" fill=\"#c2673f\"/><path d=\"M7 19h10l-1 2H8z\" fill=\"#c2673f\"/><\u002Fsvg>',\n    'Open de Londres': '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\"><path d=\"M7 3h10v3a5 5 0 0 1-10 0V3z\" fill=\"#4f9e4a\"/><path d=\"M5 4H3v3a4 4 0 0 0 4 3V8a2 2 0 0 1-2-2V4zM19 4h2v3a4 4 0 0 1-4 3V8a2 2 0 0 0 2-2V4z\" fill=\"#4f9e4a\"/><rect x=\"10.5\" y=\"11\" width=\"3\" height=\"6\" fill=\"#4f9e4a\"/><path d=\"M7.5 20h9l-.8-2.5h-7.4z\" fill=
